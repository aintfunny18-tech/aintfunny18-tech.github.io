<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anthony Woodside · Law Projects</title>
<meta name="description" content="Study tools, writing aids, and citation software built by Anthony Woodside.">
<meta property="og:title" content="Anthony Woodside · Law Projects">
<meta property="og:description" content="Study tools, writing aids, and citation software built by Anthony Woodside.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>§</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #1d2321;
    --muted: #5b6461;
    --line: #e2ded4;
    --accent: #173f3b;
    --accent-soft: #e6efec;
    --pill: #8a5a12;
    --pill-bg: #f6ecd9;
    --shadow: 0 1px 2px rgba(20, 30, 28, .05), 0 4px 16px rgba(20, 30, 28, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121615;
      --surface: #1a201e;
      --text: #e8ece9;
      --muted: #9ba6a2;
      --line: #2b3431;
      --accent: #8fcbbf;
      --accent-soft: #1f2e2b;
      --pill: #e7bf7a;
      --pill-bg: #33291a;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121615;
    --surface: #1a201e;
    --text: #e8ece9;
    --muted: #9ba6a2;
    --line: #2b3431;
    --accent: #8fcbbf;
    --accent-soft: #1f2e2b;
    --pill: #e7bf7a;
    --pill-bg: #33291a;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 16px 48px; }
  header { margin-bottom: 40px; }
  .mark {
    width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--bg);
    font: 600 24px/1 "Source Serif 4", Georgia, serif;
    margin-bottom: 20px;
  }
  h1 {
    font: 600 clamp(28px, 6vw, 38px)/1.15 "Source Serif 4", Georgia, serif;
    margin: 0 0 10px; letter-spacing: -.01em;
  }
  .lede { color: var(--muted); margin: 0; max-width: 34em; }
  section { margin-top: 36px; }
  h2 {
    font: 600 12px/1 Inter, sans-serif; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 12px;
  }
  .list { display: grid; gap: 12px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0; }
  .pill {
    font: 600 11px/1 Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase;
    color: var(--pill); background: var(--pill-bg); padding: 4px 7px; border-radius: 999px;
  }
  .card p { margin: 6px 0 14px; color: var(--muted); font-size: 15px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; text-decoration: none;
    font: 500 14px/1.2 Inter, sans-serif;
    color: var(--accent); background: var(--accent-soft); border: 1px solid transparent;
  }
  .btn.primary { background: var(--accent); color: var(--bg); }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible, .theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn .arrow { transition: transform .15s ease; }
  .btn:hover .arrow { transform: translateX(2px); }
  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 14px;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center;
  }
  footer a { color: var(--accent); }
  .theme {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font: 500 13px Inter, sans-serif; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { .btn .arrow { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">§</div>
    <h1>Anthony Woodside</h1>
    <p class="lede">Study tools, writing aids, and citation software I've built during law school.</p>
  </header>

  <main id="sections"></main>

  <footer>
    <span>Questions or feedback: <a href="mailto:anthony.woodside@ubalt.edu">anthony.woodside@ubalt.edu</a></span>
    <button class="theme" id="theme" type="button">Theme</button>
  </footer>
</div>

<script>
  // ---- Edit links here. ----
  // status: "live" shows the card; "hidden" keeps it in the file but off the page.
  // links: the first entry is the main button; any others appear beside it.
  const SECTIONS = [
    {
      title: "Study & practice",
      items: [
        {
          name: "Civil Procedure I: Study & Practice",
          desc: "Three study modules and three interactive practice exams, from starting a case through discovery.",
          links: [{ label: "Open", url: "https://civil-procedure-study.pages.dev/" }],
          status: "live"
        },
        {
          name: "1L Semester Drill",
          desc: "Multiple-choice drills across seven 1L courses, filterable by course, module, and section, with missed-question and spaced review.",
          links: [{ label: "Open", url: "https://aintfunny18-tech.github.io/finals-drill-program/1l/" }],
          status: "live"
        },
        {
          name: "2L Practice Lab",
          desc: "Offline-ready Fall 2026 drills with cumulative practice sets, spaced review, and local progress tracking.",
          links: [{ label: "Open", url: "https://aintfunny18-tech.github.io/2l-practice-lab/" }],
          status: "live"
        }
      ]
    },
    {
      title: "Legal writing & citation",
      items: [
        {
          name: "Second Read",
          desc: "Highlights the job each sentence does in an IRAC or CREAC analysis and points to one revision to make first. Runs entirely in your browser.",
          links: [{ label: "Open", url: "https://aintfunny18-tech.github.io/second-read/" }],
          status: "live"
        },
        {
          name: "Citation Workbench",
          desc: "Bluebook citation review for memos, briefs, essays, and articles. Use it on the web or download the desktop app.",
          links: [
            { label: "Open web app", url: "https://citation-workbench.onrender.com" },
            { label: "Windows & Mac downloads", url: "https://aintfunny18-tech.github.io/citation-workbench-releases/" }
          ],
          status: "live"
        }
      ]
    },
    {
      title: "Law review",
      items: [
        {
          name: "Law Journal Workbench",
          tag: "Pilot",
          desc: "Cite-check assignments, Bluesheets, and Bluebundles for law-review editors. Currently in a limited pilot.",
          links: [{ label: "Learn more", url: "https://aintfunny18-tech.github.io/law-journal-workbench-releases/" }],
          status: "live"
        }
      ]
    }
  ];
  // ---- End of links. ----

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  document.getElementById("sections").innerHTML = SECTIONS.map(sec => {
    const items = sec.items.filter(i => i.status === "live");
    if (!items.length) return "";
    return `<section><h2>${esc(sec.title)}</h2><div class="list">${items.map(i => `
      <article class="card">
        <div class="card-head"><h3>${esc(i.name)}</h3>${i.tag ? `<span class="pill">${esc(i.tag)}</span>` : ""}</div>
        <p>${esc(i.desc)}</p>
        <div class="actions">${i.links.map((l, n) =>
          `<a class="btn${n === 0 ? " primary" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} <span class="arrow" aria-hidden="true">→</span></a>`
        ).join("")}</div>
      </article>`).join("")}</div></section>`;
  }).join("");

  const root = document.documentElement, btn = document.getElementById("theme");
  const sysDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
  const current = () => root.dataset.theme || (sysDark() ? "dark" : "light");
  const label = () => { btn.textContent = current() === "dark" ? "Light theme" : "Dark theme"; };
  try { const t = localStorage.getItem("aw-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  label();
  btn.addEventListener("click", () => {
    root.dataset.theme = current() === "dark" ? "light" : "dark";
    try { localStorage.setItem("aw-theme", root.dataset.theme); } catch (e) {}
    label();
  });
</script>
</body>
</html>
